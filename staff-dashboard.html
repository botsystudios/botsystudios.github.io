<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101f"><title>Staff Workspace | Botsy Studios</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><script src="supabase-config.js"></script>
<style>
:root{color-scheme:dark;--bg:#070f1e;--panel:#0d1a30;--line:#9dbbe722;--text:#f4f8ff;--muted:#94a9c6;--blue:#2583ff;--cyan:#55d5ff;font-family:"DM Sans",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 0,#1558a522,transparent 38%),var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1440px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px;font:700 1.1rem "Space Grotesk"}.mark{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(145deg,#39a5ff,#1552d8);box-shadow:0 8px 28px #1677ff44}.tag{font-size:.68rem;color:#8fc4ff;letter-spacing:.16em;text-transform:uppercase}.btn{border:1px solid #438fff55;border-radius:9px;background:#1677ff1c;color:#c9e4ff;padding:10px 14px;font-weight:700}.btn.primary{background:linear-gradient(110deg,#1680ff,#285ce6);border:0;color:white}.hero{margin-bottom:24px}.hero h1{font:700 clamp(1.8rem,4vw,2.6rem) "Space Grotesk";letter-spacing:-.05em;margin:8px 0}.hero p{color:var(--muted);margin:0;line-height:1.7}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:22px 0}.stat,.panel{border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#10213ddd,#0a172bdf)}.stat{padding:17px}.stat span{display:block;color:var(--muted);font-size:.76rem}.stat strong{display:block;font:700 1.8rem "Space Grotesk";margin-top:9px}.layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.7fr);gap:16px;align-items:start}.panel{overflow:hidden}.panel-head{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.panel-head h2{font:600 1rem "Space Grotesk";margin:0}.orders{display:grid}.order{padding:16px 18px;border-bottom:1px solid #9dbbe714;cursor:pointer}.order:last-child{border:0}.order.selected{background:#1677ff13}.order-line{display:flex;justify-content:space-between;gap:12px}.order strong{font-size:.86rem}.muted{color:var(--muted);font-size:.72rem;margin-top:5px}.pill{font-size:.66rem;border:1px solid #438fff55;background:#1677ff16;color:#acd5ff;border-radius:99px;padding:5px 8px;height:max-content}.empty{padding:25px;color:var(--muted);font-size:.82rem;line-height:1.7}.detail{padding:18px}.detail h3{margin:0 0 6px;font:600 1.1rem "Space Grotesk"}.form{display:grid;gap:10px;margin-top:17px}.form label{display:grid;gap:6px;color:#a9bdd7;font-size:.72rem;font-weight:700}.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#071426;color:var(--text);padding:10px;font-size:.78rem}.form textarea{min-height:72px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.notes{border-top:1px solid var(--line);margin-top:17px;padding-top:15px}.note{padding:10px;border:1px solid var(--line);border-radius:8px;margin-top:8px;color:#bdcce0;font-size:.74rem;white-space:pre-wrap}.note small{display:block;color:#8299b8;margin-top:6px}.timeline{padding:14px 18px}.event{padding:0 0 15px 14px;border-left:1px solid #31537c;margin-left:5px}.event:last-child{border:0}.event strong{font-size:.76rem}.event p{font-size:.7rem;color:var(--muted);line-height:1.6;margin:5px 0}.event time{font-size:.65rem;color:#7087a6}.message{margin:18px 0;padding:12px;border-radius:9px;background:#e8b65b12;border:1px solid #e8b65b33;color:#e7cb96;font-size:.77rem;line-height:1.6}.hidden{display:none!important}.login{max-width:560px;margin:12vh auto;padding:28px}.login h1{font:700 1.8rem "Space Grotesk"}.login p{color:var(--muted);line-height:1.7}.footer{color:#647b9c;font-size:.68rem;text-align:center;margin:30px 0}@media(max-width:900px){.layout{grid-template-columns:1fr}}@media(max-width:620px){.shell{padding:17px}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.top{align-items:flex-start}.brand{font-size:.95rem}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><span class="mark">B.</span><span>BOTSY <span style="color:#79baff">STUDIOS</span><div class="tag">Staff workspace</div></span></div><div id="top-actions"><a class="btn" href="index.html">Back to website ↗</a></div></header><main id="app"><section class="panel login"><div class="tag">Secure staff access</div><h1>Staff Order Management</h1><p>Sign in with the Discord account linked to your Botsy profile. Access is checked directly against your current Discord server roles.</p><button class="btn primary" id="login">Continue with Discord</button><div id="error" class="message hidden"></div></section></main><div class="footer">Powered by Botsy Studios · Internal workspace</div></div>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
const cfg=window.BOTSY_SUPABASE_CONFIG||{},app=document.getElementById("app"),topActions=document.getElementById("top-actions");
if(!cfg.url||!cfg.anonKey){app.innerHTML='<section class="panel login"><h1>Portal configuration missing</h1><p>Check supabase-config.js.</p></section>'}
else{
const sb=createClient(cfg.url,cfg.anonKey),endpoint=cfg.url+"/functions/v1/staff-order-manager";
let current=null,selected=null,data={orders:[],events:[],notes:[]};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=s=>s?new Date(s).toLocaleString():"—";
const label=s=>String(s||"").replaceAll("_"," ").replace(/\b\w/g,c=>c.toUpperCase());
const showError=t=>{let n=document.getElementById("global-error");if(!n){n=document.createElement("div");n.id="global-error";n.className="message";app.prepend(n)}n.textContent=t;n.classList.remove("hidden")};
async function api(payload){const {data:{session}}=await sb.auth.getSession();const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token,"apikey":cfg.anonKey},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok)throw Error(j.error||"Request failed");return j}
async function load(){try{data=await api({action:"list"});current=data.staff;render()}catch(e){app.innerHTML='<section class="panel login"><div class="tag">Access check</div><h1>Staff access unavailable</h1><p>'+esc(e.message)+'</p><button class="btn" id="retry">Try again</button></section>';document.getElementById("retry").onclick=load}}
function render(){topActions.innerHTML='<button class="btn" id="logout">Sign out</button>';document.getElementById("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};
const active=data.orders.filter(o=>!["completed","cancelled"].includes(o.status)).length,unassigned=data.orders.filter(o=>!o.claimed_by_discord_id).length,done=data.orders.filter(o=>o.status==="completed").length;
app.innerHTML='<section class="hero"><div class="tag">Operations / live order control</div><h1>Staff Order Management</h1><p>Signed in as '+esc(current.name)+' · access verified through Discord roles</p></section><section class="stats"><div class="stat"><span>Total orders</span><strong>'+data.orders.length+'</strong></div><div class="stat"><span>Active orders</span><strong>'+active+'</strong></div><div class="stat"><span>Unassigned</span><strong>'+unassigned+'</strong></div><div class="stat"><span>Completed</span><strong>'+done+'</strong></div></section><div class="layout"><section class="panel"><div class="panel-head"><h2>Order queue</h2><span class="muted">'+data.orders.length+' records</span></div><div class="orders">'+(data.orders.length?data.orders.map(o=>'<article class="order '+(selected===o.id?'selected':'')+'" data-id="'+esc(o.id)+'"><div class="order-line"><div><strong>'+esc(o.service_name||"Discord service")+'</strong><div class="muted">#'+esc(o.external_order_id)+' · '+esc(o.client_discord_username||o.client_discord_id||"Client")+'</div><div class="muted">Assigned: '+esc(o.claimed_by_name||"Unassigned")+' · Updated '+esc(fmt(o.updated_at))+'</div></div><span class="pill">'+esc(label(o.status))+'</span></div></article>').join(""):'<div class="empty">No orders have reached the portal yet. Approved orders will appear here.</div>')+'</div></section><section class="panel" id="editor"><div class="empty">Select an order to manage its status, assignment, progress and internal notes.</div></section></div>';
app.querySelectorAll(".order").forEach(n=>n.onclick=()=>{selected=n.dataset.id;render();renderEditor()});if(selected)renderEditor()}
function renderEditor(){const o=data.orders.find(x=>x.id===selected);if(!o)return;const ev=data.events.filter(x=>x.order_id===o.id),notes=data.notes.filter(x=>x.order_id===o.id);const panel=document.getElementById("editor");panel.innerHTML='<div class="panel-head"><h2>Order control</h2><span class="pill">#'+esc(o.external_order_id)+'</span></div><div class="detail"><h3>'+esc(o.service_name)+'</h3><div class="muted">Client: '+esc(o.client_discord_username||o.client_discord_id||"—")+' · Ticket channel: '+esc(o.ticket_channel_id||"Not linked")+'</div><form id="update" class="form"><label>Order status<select name="status">'+["approved","in_progress","quality_check","awaiting_review","revision_requested","revision_in_progress","completed","cancelled"].map(s=>'<option value="'+s+'" '+(o.status===s?"selected":"")+'>'+label(s)+'</option>').join("")+'</select></label><div class="two"><label>Assigned staff Discord ID<input name="assigned_discord_id" inputmode="numeric" placeholder="Discord user ID" value="'+esc(o.claimed_by_discord_id||"")+'"></label><label>Staff display name<input name="assigned_name" placeholder="Staff name" value="'+esc(o.claimed_by_name||"")+'"></label></div><label>Work completed<textarea name="work_completed" maxlength="1500" placeholder="What has been completed?"></textarea></label><label>Next steps<textarea name="next_steps" maxlength="1500" placeholder="What remains to be done?"></textarea></label><label>Blockers / client action<textarea name="blocked" maxlength="1000" placeholder="Anything blocking progress?"></textarea></label><button class="btn primary">Save order update</button></form><div class="notes"><h3>Internal staff notes</h3><form id="note-form" class="form"><label>Private note<textarea name="note" maxlength="3000" required placeholder="Only verified staff can see this note."></textarea></label><button class="btn">Add internal note</button></form>'+(notes.length?notes.map(n=>'<div class="note">'+esc(n.note)+'<small>'+esc(n.author_name)+' · '+esc(fmt(n.created_at))+'</small></div>').join(""):'<p class="muted">No internal notes yet.</p>')+'</div><div class="notes"><h3>Order timeline</h3>'+(ev.length?ev.map(e=>'<div class="event"><strong>'+esc(e.title)+'</strong><p>'+esc(e.description||"")+'</p><time>'+esc(e.actor_name||"Botsy staff")+' · '+esc(fmt(e.created_at))+'</time></div>').join(""):'<p class="muted">No timeline events yet.</p>')+'</div></div>';
panel.querySelector("#update").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),b=Object.fromEntries(f.entries());try{await api({action:"update_order",order_id:o.id,...b});await load();selected=o.id;renderEditor()}catch(err){showError(err.message)}};
panel.querySelector("#note-form").onsubmit=async e=>{e.preventDefault();const note=new FormData(e.currentTarget).get("note");try{await api({action:"add_note",order_id:o.id,note});await load();selected=o.id;renderEditor()}catch(err){showError(err.message)}};
}
async function login(){const {error}=await sb.auth.signInWithOAuth({provider:"discord",options:{scopes:"identify",redirectTo:location.origin+location.pathname}});if(error)showError(error.message)}
document.getElementById("login")?.addEventListener("click",login);
const {data:{session}}=await sb.auth.getSession();if(session?.user)await load();
sb.auth.onAuthStateChange(async(event,session)=>{if(event==="SIGNED_IN"&&session?.user)await load()});
}
</script></body></html>
